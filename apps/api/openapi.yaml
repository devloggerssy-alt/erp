openapi: 3.0.0
paths:
  /auth/login:
    post:
      description: >-
        Validates email + password, returns a JWT access token and sets it as an
        HTTP-only cookie for subsequent requests.
      operationId: Auth.login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful – JWT token returned and set as cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponseDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LoginDataDto'
        '401':
          description: JWT token is missing, expired, or invalid
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Unauthorized
                  data: null
                  error:
                    code: UNAUTHORIZED
                    message: JWT token is missing, expired, or invalid
        '403':
          description: Insufficient permissions to perform this action
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Forbidden
                  data: null
                  error:
                    code: FORBIDDEN
                    message: Insufficient permissions to perform this action
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Not found
                  data: null
                  error:
                    code: NOT_FOUND
                    message: The requested resource was not found
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Validation failed
                  data: null
                  error:
                    code: VALIDATION_ERROR
                    message: Validation failed
                    details:
                      - property: email
                        constraints:
                          isEmail: email must be a valid email address
        '500':
          description: An unexpected internal server error occurred
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Internal server error
                  data: null
                  error:
                    code: INTERNAL_ERROR
                    message: An unexpected internal server error occurred
      summary: Authenticate user
      tags:
        - Auth
  /auth/register:
    post:
      description: >-
        Creates a new tenant with an admin user, then returns a JWT access token
        (auto-login).
      operationId: Auth.register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Registration successful – tenant created and JWT returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponseDto'
