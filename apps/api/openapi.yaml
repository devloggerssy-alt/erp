  /items/export:
    get:
      description: >-
        Exports items matching the current list filters (max 10,000 rows).
        Includes custom field columns.
      operationId: ItemsImportExport.exportResources
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (1-based)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 10
            example: 10
            type: number
        - name: sortField
          required: false
          in: query
          description: Field name to sort by
          schema:
            example: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          description: Full-text search keyword
          schema:
            example: ''
            type: string
        - name: searchIn
          required: false
          in: query
          description: Comma-separated field names to search within (e.g. name,symbol)
          schema:
            example: ''
            type: string
        - name: filters
          required: false
          in: query
          style: deepObject
          explode: true
          description: >-
            Structured filters. Example:
            filters[categoryId][$eq]=018e1234-abcd-7000-a001-000000000001&filters[name][$like]=sample-name&filters[code][$like]=sample-code&filters[defaultSellingPrice][$gte]=10&filters[isActive][$eq]=true&filters[createdAt][$gte]=2024-01-01T00%3A00%3A00.000Z
          schema:
            type: object
            properties:
              categoryId:
                type: object
                description: Filter on `categoryId` (id)
                properties:
                  $eq:
                    type: string
                    example: 018e1234-abcd-7000-a001-000000000001
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: 018e1234-abcd-7000-a001-000000000001
              name:
                type: object
                description: Filter on `name` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-name
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-name
              code:
                type: object
                description: Filter on `code` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-code
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-code
              defaultSellingPrice:
                type: object
                description: Filter on `defaultSellingPrice` (number)
                properties:
                  $eq:
                    type: number
                  $gte:
                    type: number
                    example: 10
                  $lte:
                    type: number
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $gte: 10
              isActive:
                type: object
                description: Filter on `isActive` (boolean)
                properties:
                  $eq:
                    type: boolean
                    example: true
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: true
              createdAt:
                type: object
                description: Filter on `createdAt` (date)
                properties:
                  $eq:
                    type: string
                  $gte:
                    type: string
                    format: date-time
                    example: '2024-01-01T00:00:00.000Z'
                  $lte:
                    type: string
                    format: date-time
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $gte: '2024-01-01T00:00:00.000Z'
            example:
              categoryId:
                $eq: 018e1234-abcd-7000-a001-000000000001
              name:
                $like: sample-name
              code:
                $like: sample-code
              defaultSellingPrice:
                $gte: 10
              isActive:
                $eq: true
              createdAt:
                $gte: '2024-01-01T00:00:00.000Z'
      responses:
