          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 10
            example: 10
            type: number
        - name: sortField
          required: false
          in: query
          description: Field name to sort by
          schema:
            example: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          description: Full-text search keyword
          schema:
            example: ''
            type: string
        - name: searchIn
