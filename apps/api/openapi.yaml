                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-module
              createdAt:
                type: object
                description: Filter on `createdAt` (date)
                properties:
                  $eq:
                    type: string
                  $gte:
                    type: string
                    format: date-time
                    example: '2024-01-01T00:00:00.000Z'
                  $lte:
                    type: string
                    format: date-time
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $gte: '2024-01-01T00:00:00.000Z'
