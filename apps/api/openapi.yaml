            application/json:
              schema:
                example:
                  status: error
                  message: Internal server error
                  data: null
                  error:
                    code: INTERNAL_ERROR
                    message: An unexpected internal server error occurred
      summary: Register a new account
      tags:
        - Auth
  /auth/logout:
    post:
      description: >-
        Clears the access_token HTTP-only cookie, effectively invalidating the
        session on the client side.
      operationId: Auth.logout
      parameters: []
      responses:
        '200':
          description: Logged out – cookie cleared
