          schema:
            type: object
            properties:
              name:
                type: object
                description: Filter on `name` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-name
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-name
              module:
                type: object
                description: Filter on `module` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-module
