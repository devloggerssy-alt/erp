  /custom-fields:
    get:
      operationId: CustomFields.list
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (1-based)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 10
            example: 10
            type: number
        - name: sortField
          required: false
          in: query
          description: Field name to sort by
          schema:
            example: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          description: Full-text search keyword
          schema:
            example: ''
            type: string
        - name: searchIn
          required: false
          in: query
          description: Comma-separated field names to search within (e.g. name,symbol)
          schema:
            example: ''
            type: string
        - name: filters
          required: false
          in: query
          style: deepObject
          explode: true
          description: >-
            Structured filters. Example:
            filters[module][$like]=sample-module&filters[type][$like]=sample-type&filters[isRequired][$eq]=true&filters[showInList][$eq]=true&filters[createdAt][$gte]=2024-01-01T00%3A00%3A00.000Z
          schema:
            type: object
            properties:
              module:
                type: object
                description: Filter on `module` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-module
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-module
              type:
                type: object
                description: Filter on `type` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-type
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-type
              isRequired:
                type: object
                description: Filter on `isRequired` (boolean)
                properties:
                  $eq:
                    type: boolean
                    example: true
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: true
              showInList:
                type: object
                description: Filter on `showInList` (boolean)
                properties:
                  $eq:
                    type: boolean
                    example: true
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: true
              createdAt:
                type: object
                description: Filter on `createdAt` (date)
                properties:
                  $eq:
                    type: string
                  $gte:
                    type: string
                    format: date-time
                    example: '2024-01-01T00:00:00.000Z'
                  $lte:
                    type: string
                    format: date-time
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $gte: '2024-01-01T00:00:00.000Z'
            example:
              module:
                $like: sample-module
              type:
                $like: sample-type
              isRequired:
                $eq: true
              showInList:
                $eq: true
              createdAt:
                $gte: '2024-01-01T00:00:00.000Z'
      responses:
        '200':
          description: Paginated list of custom fields
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponseDto'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomFieldResponseDto'
                      meta:
                        type: object
                        properties:
                          pagination:
                            type: object
                            properties:
                              total:
                                type: number
                                example: 0
                              page:
                                type: number
                                example: 1
                              limit:
                                type: number
                                example: 10
                              totalPages:
                                type: number
                                example: 0
                          filterOptions:
                            type: array
                            example:
                              - field: module
                                type: string
                                operators:
                                  - $eq
                                  - $like
                                  - $in
                                  - $isNull
                              - field: type
                                type: string
                                operators:
                                  - $eq
                                  - $like
                                  - $in
                                  - $isNull
                              - field: isRequired
                                type: boolean
                                operators:
                                  - $eq
                                  - $isNull
                              - field: showInList
                                type: boolean
                                operators:
                                  - $eq
                                  - $isNull
                              - field: createdAt
                                type: date
                                operators:
                                  - $eq
                                  - $gte
                                  - $lte
                                  - $isNull
        '401':
          description: JWT token is missing, expired, or invalid
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Unauthorized
                  data: null
                  error:
                    code: UNAUTHORIZED
