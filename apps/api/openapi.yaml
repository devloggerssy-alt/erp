          explode: true
          description: >-
            Structured filters. Example:
            filters[name][$like]=sample-name&filters[code][$like]=sample-code&filters[type][$eq]=CUSTOMER&filters[isActive][$eq]=true&filters[createdAt][$gte]=2024-01-01T00%3A00%3A00.000Z
          schema:
            type: object
            properties:
              name:
                type: object
                description: Filter on `name` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-name
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-name
              code:
                type: object
                description: Filter on `code` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-code
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-code
              type:
                type: object
                description: Filter on `type` (enum)
                properties:
                  $eq:
                    type: string
                    enum:
                      - CUSTOMER
                      - SUPPLIER
                      - CUSTOMER_SUPPLIER
                    example: CUSTOMER
                  $in:
                    type: array
                    items:
                      type: string
                      enum:
                        - CUSTOMER
                        - SUPPLIER
                        - CUSTOMER_SUPPLIER
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: CUSTOMER
