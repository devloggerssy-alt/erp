      type: object
      properties:
        field:
          type: string
          example: name
        type:
          type: string
          example: string
          enum:
            - string
            - number
            - boolean
            - date
            - enum
            - id
        operators:
          type: array
          example:
            - $eq
            - $like
            - $in
            - $isNull
          items:
            type: string
            enum:
              - $eq
              - $like
              - $gte
              - $lte
              - $in
              - $isNull
        enumValues:
          example:
            - active
            - draft
          type: array
          items:
            type: string
        foreignResourceKey:
          type: string
          example: >-
            auth|tenants|users|roles|currencies|fiscal-periods|document-sequences|units|item-categories|items|custom-fields|parties|warehouses|inventory|stock-ledger|invoice-types|invoices|cashboxes|payments|expenses|accounting|chart-of-accounts|stock-counts|reports|dashboard|ai|audit-logs|tags|tag-assignments|item-relations|catalog-entities|item-catalog-entities|brands|financial-settings
