    get:
      description: >-
        Returns a paginated, filterable list of brands belonging to the
        authenticated tenant.
      operationId: Brands.list
      parameters:
        - name: page
          required: false
          in: query
          description: Page number (1-based)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 10
            example: 10
            type: number
        - name: sortField
          required: false
          in: query
          description: Field name to sort by
          schema:
            example: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          description: Full-text search keyword
          schema:
            example: ''
            type: string
        - name: searchIn
          required: false
          in: query
          description: Comma-separated field names to search within (e.g. name,symbol)
          schema:
            example: ''
            type: string
        - name: filters
          required: false
          in: query
          style: deepObject
          explode: true
          description: >-
            Structured filters. Example:
            filters[name][$like]=sample-name&filters[isActive][$eq]=true&filters[createdAt][$gte]=2024-01-01T00%3A00%3A00.000Z
          schema:
            type: object
            properties:
              name:
                type: object
                description: Filter on `name` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-name
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-name
              isActive:
                type: object
                description: Filter on `isActive` (boolean)
                properties:
                  $eq:
                    type: boolean
                    example: true
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: true
              createdAt:
                type: object
                description: Filter on `createdAt` (date)
                properties:
                  $eq:
                    type: string
                  $gte:
                    type: string
                    format: date-time
                    example: '2024-01-01T00:00:00.000Z'
                  $lte:
                    type: string
                    format: date-time
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $gte: '2024-01-01T00:00:00.000Z'
            example:
              name:
                $like: sample-name
              isActive:
                $eq: true
              createdAt:
                $gte: '2024-01-01T00:00:00.000Z'
      responses:
        '200':
          description: Paginated list of brands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponseDto'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrandResponseDto'
                      meta:
                        type: object
                        properties:
                          pagination:
                            type: object
                            properties:
                              total:
                                type: number
                                example: 0
                              page:
                                type: number
                                example: 1
                              limit:
                                type: number
                                example: 10
                              totalPages:
                                type: number
                                example: 0
                          filterOptions:
                            type: array
                            example:
                              - field: name
                                type: string
                                operators:
                                  - $eq
                                  - $like
                                  - $in
                                  - $isNull
                              - field: isActive
                                type: boolean
                                operators:
                                  - $eq
                                  - $isNull
                              - field: createdAt
                                type: date
                                operators:
                                  - $eq
                                  - $gte
                                  - $lte
                                  - $isNull
        '401':
          description: JWT token is missing, expired, or invalid
          content:
            application/json:
              schema:
